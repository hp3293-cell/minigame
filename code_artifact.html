<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>10秒極速連點對決 - Cyberpunk Speed Tap</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700;900&display=swap');

        body {
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #05050d;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Neon Glow Utility */
        .neon-glow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6), inset 0 0 15px rgba(6, 182, 212, 0.4);
        }
        .neon-glow-rose {
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.6), inset 0 0 15px rgba(244, 63, 94, 0.4);
        }
        .neon-glow-amber {
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.7);
        }

        /* Dynamic Click Button Animations */
        .tap-btn {
            background: radial-gradient(circle at 30% 30%, #2563eb, #1e1b4b, #09090b);
            transition: transform 0.06s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .tap-btn:active {
            transform: scale(0.92) !important;
        }

        /* Screen Shake */
        .shake-light {
            animation: shake 0.1s cubic-bezier(.36,.07,.19,.97) both;
        }
        .shake-heavy {
            animation: shakeHeavy 0.12s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }

        @keyframes shakeHeavy {
            10%, 90% { transform: translate3d(-3px, 2px, 0); }
            20%, 80% { transform: translate3d(4px, -3px, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 5px, 0); }
            40%, 60% { transform: translate3d(6px, -4px, 0); }
        }

        /* Particle Floating & Shockwaves */
        @keyframes floatUpPop {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.8) rotate(0deg);
            }
            50% {
                transform: translate(-50%, -100px) scale(1.4) rotate(var(--rot));
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -160px) scale(1.8) rotate(var(--rot));
            }
        }

        .combo-particle {
            position: absolute;
            pointer-events: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            animation: floatUpPop 0.55s ease-out forwards;
            z-index: 60;
        }

        @keyframes ringExpand {
            0% {
                width: 100px;
                height: 100px;
                opacity: 0.9;
                border-width: 6px;
            }
            100% {
                width: 320px;
                height: 320px;
                opacity: 0;
                border-width: 1px;
            }
        }

        .shockwave {
            position: absolute;
            border-style: solid;
            border-color: rgba(56, 189, 248, 0.8);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: ringExpand 0.45s ease-out forwards;
            z-index: 40;
        }

        /* Glassmorphism Panel */
        .cyber-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Grid Background Pattern */
        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body id="mainBody" class="min-h-screen text-slate-100 flex flex-col justify-between items-center p-3 sm:p-5 cyber-grid relative">

    <!-- Glowing Background Ambient Spheres -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-1/4 -left-20 w-80 h-80 bg-cyan-600/20 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute bottom-1/4 -right-20 w-80 h-80 bg-rose-600/20 rounded-full blur-3xl animate-pulse"></div>
    </div>

    <!-- Header & Sound Controls -->
    <header class="w-full max-w-xl flex justify-between items-center z-10 my-1">
        <div class="flex items-center gap-2">
            <span class="px-3 py-1 rounded-full bg-cyan-950/80 border border-cyan-500/50 text-cyan-400 text-xs font-bold font-orbitron tracking-widest flex items-center gap-1.5 shadow-lg shadow-cyan-950/50">
                <i class="fa-solid fa-bolt text-yellow-400 animate-bounce"></i> 10s TAP DUEL
            </span>
        </div>
        <button id="muteBtn" onclick="toggleMute()" class="w-10 h-10 rounded-xl cyber-panel border-cyan-500/30 text-cyan-400 hover:text-white flex items-center justify-center transition active:scale-90">
            <i id="muteIcon" class="fa-solid fa-volume-high"></i>
        </button>
    </header>

    <!-- Game Container -->
    <main class="w-full max-w-xl z-10 flex flex-col items-center gap-4 my-auto">

        <!-- Countdown / Timer Section -->
        <div class="cyber-panel w-full rounded-2xl p-4 text-center relative overflow-hidden border-cyan-500/40">
            <div class="flex justify-between items-center px-2 mb-1">
                <span class="text-xs font-orbitron tracking-widest text-cyan-400 uppercase">TIME REMAINING</span>
                <span id="diffBadge" class="text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400 transition-all">READY</span>
            </div>
            
            <div id="timerDisplay" class="text-6xl sm:text-7xl font-black font-orbitron text-yellow-400 tracking-wider drop-shadow-[0_0_15px_rgba(250,204,21,0.5)]">
                10.0<span class="text-2xl font-semibold text-yellow-500/80">s</span>
            </div>

            <!-- Precision Progress Bar -->
            <div class="w-full bg-slate-950 h-3.5 rounded-full mt-3 p-0.5 border border-slate-800 overflow-hidden">
                <div id="timerBar" class="bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-300 h-full rounded-full w-full transition-all duration-75"></div>
            </div>
        </div>

        <!-- Dynamic Race Progress Track (Player VS AI) -->
        <div class="cyber-panel w-full rounded-2xl p-4 sm:p-5 space-y-4">
            
            <!-- Player Bar -->
            <div class="relative">
                <div class="flex justify-between items-center mb-1">
                    <span class="font-bold text-sm sm:text-base flex items-center gap-2 text-cyan-400 font-orbitron">
                        <i class="fa-solid fa-user-ninja text-cyan-300"></i> YOU
                    </span>
                    <div class="text-right font-orbitron">
                        <span id="playerScore" class="text-2xl font-black text-cyan-400">0</span>
                        <span class="text-xs text-slate-400 ml-1">(<span id="playerCps">0.0</span> CPS)</span>
                    </div>
                </div>
                <div class="w-full bg-slate-950 h-6 rounded-full p-1 border border-cyan-500/30 relative overflow-visible">
                    <div id="playerBar" class="bg-gradient-to-r from-blue-600 via-cyan-400 to-teal-300 h-full rounded-full w-0 transition-all duration-150 relative neon-glow-cyan">
                        <!-- Avatar Marker -->
                        <div class="absolute -right-3 -top-2 w-8 h-8 rounded-full bg-cyan-400 border-2 border-white flex items-center justify-center text-slate-950 text-xs shadow-lg shadow-cyan-500/50 z-10">
                            ⚡
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI Bar -->
            <div class="relative">
                <div class="flex justify-between items-center mb-1">
                    <span class="font-bold text-sm sm:text-base flex items-center gap-2 text-rose-400 font-orbitron">
                        <i class="fa-solid fa-robot text-rose-300"></i> CYBER AI
                    </span>
                    <div class="text-right font-orbitron">
                        <span id="aiScore" class="text-2xl font-black text-rose-400">0</span>
                        <span class="text-xs text-slate-400 ml-1">(<span id="aiCps">0.0</span> CPS)</span>
                    </div>
                </div>
                <div class="w-full bg-slate-950 h-6 rounded-full p-1 border border-rose-500/30 relative overflow-visible">
                    <div id="aiBar" class="bg-gradient-to-r from-rose-700 via-rose-500 to-pink-400 h-full rounded-full w-0 transition-all duration-150 relative neon-glow-rose">
                        <!-- Avatar Marker -->
                        <div class="absolute -right-3 -top-2 w-8 h-8 rounded-full bg-rose-500 border-2 border-white flex items-center justify-center text-white text-xs shadow-lg shadow-rose-500/50 z-10">
                            🤖
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Combo Multiplier Display -->
        <div class="h-8 flex items-center justify-center">
            <div id="comboContainer" class="opacity-0 transition-all transform scale-75 flex items-center gap-2">
                <span id="comboBadge" class="text-xs font-black font-orbitron px-2.5 py-0.5 rounded-md bg-gradient-to-r from-amber-500 to-red-500 text-slate-950 shadow-lg">
                    COMBO
                </span>
                <span id="comboText" class="text-xl font-black font-orbitron text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-red-500 drop-shadow-[0_0_10px_rgba(245,158,11,0.8)]">
                    x12
                </span>
            </div>
        </div>

        <!-- Main Giant Tap Button Area -->
        <div class="relative w-full flex justify-center items-center my-1">
            <!-- Shockwaves & Particles Container -->
            <div id="fxContainer" class="absolute inset-0 pointer-events-none z-30 flex items-center justify-center"></div>

            <!-- Giant Neon Click Button -->
            <button id="clickBtn" disabled 
                class="tap-btn w-56 h-56 sm:w-64 sm:h-64 rounded-full text-white font-orbitron font-black border-4 border-cyan-400/50 cursor-not-allowed opacity-60 select-none relative z-20 flex flex-col items-center justify-center gap-2 shadow-[0_0_40px_rgba(6,182,212,0.3)]">
                <i class="fa-solid fa-hand-pointer text-5xl sm:text-6xl text-cyan-300 animate-pulse"></i>
                <span class="text-2xl sm:text-3xl font-extrabold tracking-wider">TAP FAST!</span>
                <span id="btnSubText" class="text-xs text-cyan-200/80 font-rajdhani font-semibold">CLICK "START GAME"</span>
            </button>
        </div>

        <!-- Control Action Buttons -->
        <div class="flex gap-3 w-full max-w-xs">
            <button id="startBtn" onclick="startGame()" class="flex-1 py-3.5 bg-gradient-to-r from-cyan-500 via-teal-500 to-emerald-500 hover:brightness-110 font-black font-orbitron text-slate-950 text-base sm:text-lg rounded-xl shadow-lg shadow-cyan-950/80 transition active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> START DUEL
            </button>
            <button onclick="resetGame()" class="py-3.5 px-4 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 font-bold rounded-xl transition active:scale-95">
                <i class="fa-solid fa-arrow-rotate-left"></i>
            </button>
        </div>

    </main>

    <!-- Footer Stats -->
    <footer class="w-full max-w-xl flex justify-between items-center text-xs font-orbitron text-slate-500 my-1 z-10 px-2">
        <div>HIGH SCORE: <span id="highScore" class="text-cyan-400 font-bold">0</span></div>
        <div>RECORD CPS: <span id="maxCps" class="text-amber-400 font-bold">0.0</span></div>
    </footer>

    <!-- Result Modal -->
    <div id="resultModal" class="fixed inset-0 bg-black/85 backdrop-blur-xl z-50 flex items-center justify-center p-4 hidden opacity-0 transition-all duration-300">
        <div class="cyber-panel bg-slate-950/90 border-2 border-cyan-500/50 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl transform scale-90 transition-all duration-300 relative overflow-hidden">
            
            <!-- Result Banner Glow -->
            <div id="modalGlow" class="absolute -top-20 left-1/2 -translate-x-1/2 w-48 h-48 rounded-full blur-3xl pointer-events-none"></div>

            <div id="modalIcon" class="w-20 h-20 rounded-2xl mx-auto flex items-center justify-center text-4xl mb-3 border shadow-2xl">
                🏆
            </div>

            <h2 id="modalTitle" class="text-3xl font-black font-orbitron tracking-wider mb-1">VICTORY!</h2>
            <p id="modalSubtitle" class="text-slate-400 text-xs font-rajdhani font-semibold mb-5">10-SECOND TAPPING SHOWDOWN</p>

            <!-- Detailed Stats Grid -->
            <div class="bg-slate-900/80 rounded-2xl p-4 border border-slate-800 space-y-2.5 mb-6 text-left font-orbitron text-xs">
                <div class="flex justify-between items-center">
                    <span class="text-cyan-400 font-bold flex items-center gap-1.5"><i class="fa-solid fa-user"></i> YOUR TAPS</span>
                    <span class="font-bold text-sm text-white"><span id="mPlayerTaps">0</span> <span class="text-[10px] text-slate-400">(<span id="mPlayerCps">0.0</span> CPS)</span></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-rose-400 font-bold flex items-center gap-1.5"><i class="fa-solid fa-robot"></i> AI TAPS</span>
                    <span class="font-bold text-sm text-white"><span id="mAiTaps">0</span> <span class="text-[10px] text-slate-400">(<span id="mAiCps">0.0</span> CPS)</span></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-amber-400 font-bold flex items-center gap-1.5"><i class="fa-solid fa-fire"></i> MAX COMBO</span>
                    <span id="mMaxCombo" class="font-bold text-sm text-amber-300">x0</span>
                </div>
                <hr class="border-slate-800 my-1">
                <div class="flex justify-between items-center pt-0.5">
                    <span class="text-slate-400 font-bold">NET DIFFERENCE</span>
                    <span id="mMargin" class="font-extrabold text-sm text-yellow-400">+0 TAPS</span>
                </div>
            </div>

            <button onclick="closeModalAndStart()" class="w-full py-4 bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 hover:brightness-110 text-white font-black font-orbitron text-base rounded-xl shadow-lg shadow-cyan-950/80 transition active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> REPLAY MATCH
            </button>
        </div>
    </div>

    <!-- Web Audio & Game Engine Logic -->
    <script>
        // Synthesizer Web Audio Audio Engine
        class CyberAudio {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTap(comboCount) {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                // Pitch scales dynamically with combo count
                const baseFreq = 400 + Math.min(comboCount * 18, 600);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.06);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.06);
            }

            playBeep(isFinal) {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.value = isFinal ? 880 : 440;
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + (isFinal ? 0.3 : 0.1));

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + (isFinal ? 0.3 : 0.1));
            }

            playWin() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.25);
                });
            }

            playLose() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [400, 350, 300, 220];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, now + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.12);
                    osc.stop(now + i * 0.12 + 0.2);
                });
            }
        }

        const audio = new CyberAudio();

        function toggleMute() {
            audio.isMuted = !audio.isMuted;
            const icon = document.getElementById('muteIcon');
            icon.className = audio.isMuted ? "fa-solid fa-volume-xmark text-rose-400" : "fa-solid fa-volume-high text-cyan-400";
        }

        // State Variables
        const GAME_TIME = 10.0;
        let timeLeft = GAME_TIME;
        let isPlaying = false;
        let playerClicks = 0;
        let aiClicks = 0;
        let combo = 0;
        let maxCombo = 0;
        let comboTimer = null;

        let gameLoopTimer = null;
        let aiLoopTimer = null;
        let startTime = 0;

        // Highest Records
        let highScore = localStorage.getItem('tap_game_highscore') || 0;
        let recordCps = localStorage.getItem('tap_game_maxcps') || '0.0';
        document.getElementById('highScore').innerText = highScore;
        document.getElementById('maxCps').innerText = recordCps;

        // Elements
        const mainBody = document.getElementById('mainBody');
        const timerDisplay = document.getElementById('timerDisplay');
        const timerBar = document.getElementById('timerBar');
        const playerScoreEl = document.getElementById('playerScore');
        const playerCpsEl = document.getElementById('playerCps');
        const playerBar = document.getElementById('playerBar');
        const aiScoreEl = document.getElementById('aiScore');
        const aiCpsEl = document.getElementById('aiCps');
        const aiBar = document.getElementById('aiBar');
        const clickBtn = document.getElementById('clickBtn');
        const startBtn = document.getElementById('startBtn');
        const diffBadge = document.getElementById('diffBadge');
        const fxContainer = document.getElementById('fxContainer');
        const comboContainer = document.getElementById('comboContainer');
        const comboText = document.getElementById('comboText');

        // Click Event Bindings
        clickBtn.addEventListener('mousedown', handleTap);
        clickBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTap(e);
        });

        function handleTap(e) {
            if (!isPlaying) return;

            audio.init();
            playerClicks++;
            combo++;
            if (combo > maxCombo) maxCombo = combo;

            // Reset combo cooldown timer (1 second timeout)
            clearTimeout(comboTimer);
            comboTimer = setTimeout(() => {
                combo = 0;
                updateComboUI();
            }, 800);

            audio.playTap(combo);

            // Screen Shake Effect
            triggerShake(combo >= 15 ? 'heavy' : 'light');

            // Render Particle & Shockwave FX
            createClickFX(e);

            // Updates
            playerScoreEl.innerText = playerClicks;
            updateComboUI();
            updateProgressBars();
        }

        function triggerShake(type) {
            mainBody.classList.remove('shake-light', 'shake-heavy');
            void mainBody.offsetWidth; // Trigger Reflow
            mainBody.classList.add(type === 'heavy' ? 'shake-heavy' : 'shake-light');
            setTimeout(() => {
                mainBody.classList.remove('shake-light', 'shake-heavy');
            }, 120);
        }

        function updateComboUI() {
            if (combo > 2) {
                comboContainer.classList.remove('opacity-0', 'scale-75');
                comboContainer.classList.add('opacity-100', 'scale-100');
                comboText.innerText = `x${combo}`;
            } else {
                comboContainer.classList.add('opacity-0', 'scale-75');
                comboContainer.classList.remove('opacity-100', 'scale-100');
            }
        }

        function createClickFX(e) {
            const rect = clickBtn.getBoundingClientRect();
            let x = rect.width / 2;
            let y = rect.height / 2;

            if (e.touches && e.touches.length > 0) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else if (e.clientX) {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            // Shockwave Ring
            const ring = document.createElement('div');
            ring.className = 'shockwave';
            ring.style.left = `${rect.left + x}px`;
            ring.style.top = `${rect.top + y}px`;
            fxContainer.appendChild(ring);
            setTimeout(() => ring.remove(), 450);

            // Dynamic Particle Pops
            const particle = document.createElement('div');
            particle.className = 'combo-particle';
            const randomRot = `${(Math.random() - 0.5) * 60}deg`;
            particle.style.setProperty('--rot', randomRot);

            if (combo > 10) {
                particle.innerText = `+1 🔥`;
                particle.className += ' text-amber-300 drop-shadow-[0_0_8px_rgba(245,158,11,0.9)]';
            } else {
                particle.innerText = `+1`;
                particle.className += ' text-cyan-300 drop-shadow-[0_0_8px_rgba(6,182,212,0.9)]';
            }

            particle.style.left = `${rect.left + x + (Math.random() - 0.5) * 30}px`;
            particle.style.top = `${rect.top + y + (Math.random() - 0.5) * 20}px`;
            fxContainer.appendChild(particle);
            setTimeout(() => particle.remove(), 550);
        }

        function startGame() {
            if (isPlaying) return;

            audio.init();
            resetState();

            isPlaying = true;
            startTime = Date.now();

            // UI Buttons Active State
            clickBtn.disabled = false;
            clickBtn.classList.remove('opacity-60', 'cursor-not-allowed');
            clickBtn.classList.add('cursor-pointer', 'neon-glow-cyan');
            document.getElementById('btnSubText').innerText = 'TAP AS FAST AS YOU CAN!';

            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');

            let lastBeepSec = 10;

            // Main Game High-Precision Timer (Every 30ms)
            gameLoopTimer = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                timeLeft = Math.max(0, GAME_TIME - elapsed);

                // Audio Beep Countdown on last 3 seconds
                const currentSec = Math.ceil(timeLeft);
                if (currentSec <= 3 && currentSec !== lastBeepSec && currentSec > 0) {
                    audio.playBeep(false);
                    lastBeepSec = currentSec;
                }

                timerDisplay.innerHTML = `${timeLeft.toFixed(1)}<span class="text-2xl font-semibold text-yellow-500/80">s</span>`;
                timerBar.style.width = `${(timeLeft / GAME_TIME) * 100}%`;

                // Calculate Live CPS
                const curElapsed = Math.max(0.1, elapsed);
                playerCpsEl.innerText = (playerClicks / curElapsed).toFixed(1);
                aiCpsEl.innerText = (aiClicks / curElapsed).toFixed(1);

                // Real-time Lead/Lag Badge Update
                updateDiffBadge();

                if (timeLeft <= 0) {
                    audio.playBeep(true);
                    endGame();
                }
            }, 30);

            // AI Tap Simulation (Target ~50 clicks / 10s = ~5 CPS)
            scheduleAiTap();
        }

        function scheduleAiTap() {
            if (!isPlaying) return;

            // Average 195ms interval with realistic human-like micro jitter
            const delay = 195 + (Math.random() * 70 - 35);

            aiLoopTimer = setTimeout(() => {
                if (isPlaying) {
                    aiClicks++;
                    aiScoreEl.innerText = aiClicks;
                    updateProgressBars();
                    scheduleAiTap();
                }
            }, delay);
        }

        function updateDiffBadge() {
            const diff = playerClicks - aiClicks;
            if (diff > 0) {
                diffBadge.innerText = `+${diff} AHEAD!`;
                diffBadge.className = "text-xs font-black px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-500/40 animate-pulse";
            } else if (diff < 0) {
                diffBadge.innerText = `${diff} BEHIND!`;
                diffBadge.className = "text-xs font-black px-2 py-0.5 rounded bg-rose-950 text-rose-400 border border-rose-500/40";
            } else {
                diffBadge.innerText = `TIED!`;
                diffBadge.className = "text-xs font-black px-2 py-0.5 rounded bg-slate-800 text-slate-300";
            }
        }

        function updateProgressBars() {
            // Target scale benchmarked against 60 clicks
            const targetMax = Math.max(playerClicks, aiClicks, 50);
            
            playerBar.style.width = `${Math.min(100, (playerClicks / targetMax) * 100)}%`;
            aiBar.style.width = `${Math.min(100, (aiClicks / targetMax) * 100)}%`;
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameLoopTimer);
            clearTimeout(aiLoopTimer);
            clearTimeout(comboTimer);

            clickBtn.disabled = true;
            clickBtn.classList.add('opacity-60', 'cursor-not-allowed');
            clickBtn.classList.remove('neon-glow-cyan');
            document.getElementById('btnSubText').innerText = 'GAME OVER - CLICK REPLAY';

            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            const finalPlayerCps = (playerClicks / GAME_TIME).toFixed(1);
            const finalAiCps = (aiClicks / GAME_TIME).toFixed(1);

            // LocalStorage Highscores Update
            if (playerClicks > highScore) {
                highScore = playerClicks;
                localStorage.setItem('tap_game_highscore', highScore);
                document.getElementById('highScore').innerText = highScore;
            }

            if (parseFloat(finalPlayerCps) > parseFloat(recordCps)) {
                recordCps = finalPlayerCps;
                localStorage.setItem('tap_game_maxcps', recordCps);
                document.getElementById('maxCps').innerText = recordCps;
            }

            // Populate Modal Results
            document.getElementById('mPlayerTaps').innerText = playerClicks;
            document.getElementById('mPlayerCps').innerText = finalPlayerCps;
            document.getElementById('mAiTaps').innerText = aiClicks;
            document.getElementById('mAiCps').innerText = finalAiCps;
            document.getElementById('mMaxCombo').innerText = `x${maxCombo}`;

            const mTitle = document.getElementById('modalTitle');
            const mSubtitle = document.getElementById('modalSubtitle');
            const mIcon = document.getElementById('modalIcon');
            const mMargin = document.getElementById('modalMargin');
            const mGlow = document.getElementById('modalGlow');

            const diff = playerClicks - aiClicks;

            if (diff > 0) {
                audio.playWin();
                mIcon.className = "w-20 h-20 rounded-2xl mx-auto flex items-center justify-center text-4xl mb-3 border bg-cyan-950/80 border-cyan-400/50 text-cyan-300 shadow-[0_0_30px_rgba(6,182,212,0.5)]";
                mIcon.innerHTML = "🏆";
                mTitle.innerText = "VICTORY!";
                mTitle.className = "text-3xl font-black font-orbitron tracking-wider mb-1 text-cyan-300 drop-shadow-[0_0_10px_rgba(6,182,212,0.8)]";
                mSubtitle.innerText = "YOU DOMINATED THE CYBER AI!";
                mMargin.innerText = `+${diff} TAPS AHEAD`;
                mMargin.className = "font-extrabold text-sm text-cyan-400";
                mGlow.className = "absolute -top-20 left-1/2 -translate-x-1/2 w-48 h-48 rounded-full blur-3xl pointer-events-none bg-cyan-500/30";

                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 120,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                }
            } else if (diff < 0) {
                audio.playLose();
                mIcon.className = "w-20 h-20 rounded-2xl mx-auto flex items-center justify-center text-4xl mb-3 border bg-rose-950/80 border-rose-500/50 text-rose-400 shadow-[0_0_30px_rgba(244,63,94,0.5)]";
                mIcon.innerHTML = "🤖";
                mTitle.innerText = "DEFEATED!";
                mTitle.className = "text-3xl font-black font-orbitron tracking-wider mb-1 text-rose-400 drop-shadow-[0_0_10px_rgba(244,63,94,0.8)]";
                mSubtitle.innerText = "CYBER AI OUTPERFORMED YOU THIS TIME!";
                mMargin.innerText = `${diff} TAPS BEHIND`;
                mMargin.className = "font-extrabold text-sm text-rose-400";
                mGlow.className = "absolute -top-20 left-1/2 -translate-x-1/2 w-48 h-48 rounded-full blur-3xl pointer-events-none bg-rose-500/30";
            } else {
                mIcon.className = "w-20 h-20 rounded-2xl mx-auto flex items-center justify-center text-4xl mb-3 border bg-amber-950/80 border-amber-500/50 text-amber-300 shadow-[0_0_30px_rgba(245,158,11,0.5)]";
                mIcon.innerHTML = "⚡";
                mTitle.innerText = "DEAD HEAT!";
                mTitle.className = "text-3xl font-black font-orbitron tracking-wider mb-1 text-amber-300";
                mSubtitle.innerText = "AN EXACT DRAW AGAINST THE MACHINE!";
                mMargin.innerText = `TIED MATCH`;
                mMargin.className = "font-extrabold text-sm text-amber-300";
                mGlow.className = "absolute -top-20 left-1/2 -translate-x-1/2 w-48 h-48 rounded-full blur-3xl pointer-events-none bg-amber-500/30";
            }

            showModal();
        }

        function resetGame() {
            isPlaying = false;
            clearInterval(gameLoopTimer);
            clearTimeout(aiLoopTimer);
            clearTimeout(comboTimer);

            resetState();

            clickBtn.disabled = true;
            clickBtn.classList.add('opacity-60', 'cursor-not-allowed');
            clickBtn.classList.remove('neon-glow-cyan');
            document.getElementById('btnSubText').innerText = 'CLICK "START DUEL"';

            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function resetState() {
            timeLeft = GAME_TIME;
            playerClicks = 0;
            aiClicks = 0;
            combo = 0;
            maxCombo = 0;

            timerDisplay.innerHTML = `10.0<span class="text-2xl font-semibold text-yellow-500/80">s</span>`;
            timerBar.style.width = '100%';

            playerScoreEl.innerText = '0';
            playerCpsEl.innerText = '0.0';
            playerBar.style.width = '0%';

            aiScoreEl.innerText = '0';
            aiCpsEl.innerText = '0.0';
            aiBar.style.width = '0%';

            diffBadge.innerText = 'READY';
            diffBadge.className = "text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400";

            updateComboUI();
        }

        const modal = document.getElementById('resultModal');

        function showModal() {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-90');
                modal.querySelector('div').classList.add('scale-100');
            }, 10);
        }

        function closeModalAndStart() {
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-90');
            setTimeout(() => {
                modal.classList.add('hidden');
                startGame();
            }, 300);
        }
    </script>
</body>
</html>
