<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CYBER PULSE 3D - HTML5 Rhythm Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #030014;
            color: #ffffff;
            overflow: hidden;
            touch-action: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(13, 12, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        .neon-border-cyan {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5), inset 0 0 15px rgba(6, 182, 212, 0.2);
            border: 1px solid #06b6d4;
        }

        .neon-border-magenta {
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5), inset 0 0 15px rgba(236, 72, 153, 0.2);
            border: 1px solid #ec4899;
        }

        .neon-text-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.5);
        }

        .neon-text-magenta {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.8), 0 0 20px rgba(236, 72, 153, 0.5);
        }

        /* Key Touch Buttons */
        .touch-btn {
            background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.05s ease, background-color 0.05s ease;
        }

        .touch-btn:active, .touch-btn.pressed {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.25);
        }

        /* Pulse Animations */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .glow-pulse {
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>
<body class="w-screen h-screen relative flex flex-col items-center justify-center overflow-hidden bg-black">

    <!-- Game Viewport Canvas Container -->
    <div id="game-container" class="relative w-full h-full max-w-4xl max-h-[900px] flex items-center justify-center overflow-hidden">
        <canvas id="gameCanvas" class="w-full h-full block"></canvas>

        <!-- Dynamic In-Game HUD Overlay -->

            <div class="flex flex-col gap-2">

            <!-- Right Controls: Pause Button -->

                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>

            </button>

        <!-- On-Screen Touch Controls (Visible on Mobile / Touch) -->
        <div id="touchControls" class="absolute bottom-2 left-0 w-full px-4 grid grid-cols-4 gap-2 h-28 pointer-events-auto sm:hidden opacity-80">

        </div>

        <!-- Main Menu Modal -->
        <div id="mainMenu" class="absolute inset-0 glass-panel flex flex-col items-center justify-center p-6 text-center z-20">
            <div class="relative mb-6">
                <h1 class="text-4xl sm:text-6xl font-orbitron font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-pink-500 neon-text-cyan">
                    CYBER PULSE 3D
                </h1>
                <p class="text-xs sm:text-sm tracking-[0.3em] uppercase text-cyan-300/80 font-bold mt-1">High Octane HTML5 Rhythm Track</p>
            </div>

            <!-- Song Difficulty Selection -->
            <div class="w-full max-w-sm flex flex-col gap-3 my-6">
                <p class="text-xs tracking-wider uppercase text-gray-400 font-semibold mb-1">Select Track & Difficulty</p>
                
                <button data-song="0" class="song-select-btn glass-panel p-4 rounded-xl flex items-center justify-between border border-cyan-500/30 hover:border-cyan-400 hover:bg-cyan-500/10 transition-all text-left group">
                    <div>
                        <div class="font-orbitron font-bold text-cyan-300 group-hover:text-white">1. CYBER BREEZE</div>

                <button data-song="1" class="song-select-btn glass-panel p-4 rounded-xl flex items-center justify-between border border-purple-500/30 hover:border-purple-400 hover:bg-purple-500/10 transition-all text-left group active-song border-purple-500 bg-purple-500/20">
                    <div>
                        <div class="font-orbitron font-bold text-purple-300 group-hover:text-white">2. NEON RUSH</div>

                <button data-song="2" class="song-select-btn glass-panel p-4 rounded-xl flex items-center justify-between border border-pink-500/30 hover:border-pink-400 hover:bg-pink-500/10 transition-all text-left group">
                    <div>
                        <div class="font-orbitron font-bold text-pink-300 group-hover:text-white">3. HYPERDRIVE</div>
                        <div class="text-xs text-gray-400">BPM: 165 • Hard Track</div>
                    </div>
                    <span class="px-2.5 py-1 text-xs font-bold font-orbitron bg-pink-500/20 text-pink-300 rounded border border-pink-500/40">HARD</span>
                </button>
            </div>

            <!-- Start Game Button -->
            <button id="startBtn" class="w-full max-w-sm py-4 rounded-xl font-orbitron font-bold text-lg tracking-wider text-black bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-pink-500 hover:brightness-110 active:scale-98 shadow-lg shadow-cyan-500/30 transition-all">
                START TRACK
            </button>

            <!-- Keyboard Controls Guide -->
            <div class="mt-6 flex items-center gap-2 text-xs text-gray-400 font-mono">
                <span>KEYS:</span>
                <span class="px-2 py-1 bg-gray-800 border border-gray-700 rounded text-cyan-300 font-bold">D</span>

        </div>

        <!-- Pause / Results Modal Overlay -->
        <div id="modalOverlay" class="absolute inset-0 glass-panel flex flex-col items-center justify-center p-6 z-30 hidden">

            <div id="resultsPanel" class="w-full max-w-md flex flex-col items-center text-center hidden">

                    S
                </div>

                <!-- Stats Grid -->
                <div class="w-full grid grid-cols-2 gap-3 mb-6 text-left">
                    <div class="bg-gray-900/60 p-3 rounded-lg border border-gray-800">
                        <div class="text-[10px] text-gray-400 uppercase tracking-widest">Final Score</div>
                        <div id="resScore" class="text-xl font-orbitron font-bold text-cyan-400">0000000</div>
                    </div>
                    <div class="bg-gray-900/60 p-3 rounded-lg border border-gray-800">
                        <div class="text-[10px] text-gray-400 uppercase tracking-widest">Accuracy</div>
                        <div id="resAccuracy" class="text-xl font-orbitron font-bold text-pink-400">0.0%</div>
                    </div>
                    <div class="bg-gray-900/60 p-3 rounded-lg border border-gray-800">
                        <div class="text-[10px] text-gray-400 uppercase tracking-widest">Max Combo</div>
                        <div id="resMaxCombo" class="text-xl font-orbitron font-bold text-amber-400">0</div>
                    </div>
                    <div class="bg-gray-900/60 p-3 rounded-lg border border-gray-800">
                        <div class="text-[10px] text-gray-400 uppercase tracking-widest">Perfects / Misses</div>
                        <div id="resHitsMisses" class="text-sm font-orbitron font-bold text-gray-200 mt-1">0 / 0</div>
                    </div>
                </div>

                <div class="flex gap-3 w-full">
                    <button id="retryBtn" class="flex-1 py-3 rounded-xl font-orbitron font-bold text-white bg-gray-800 hover:bg-gray-700 border border-gray-600 transition-all">
                        RETRY
                    </button>
                    <button id="menuBtn" class="flex-1 py-3 rounded-xl font-orbitron font-bold text-black bg-gradient-to-r from-cyan-400 to-pink-500 hover:brightness-110 transition-all">
                        MAIN MENU
                    </button>
                </div>
            </div>

            <!-- Pause Panel -->
            <div id="pausePanel" class="w-full max-w-sm flex flex-col items-center text-center hidden">
                <h2 class="text-3xl font-orbitron font-black text-cyan-400 tracking-wider mb-6">GAME PAUSED</h2>
                <div class="flex flex-col gap-3 w-full">

                        RESUME
                    </button>
                    <button id="restartPauseBtn" class="w-full py-3 rounded-xl font-orbitron font-bold text-white bg-gray-800 hover:bg-gray-700 border border-gray-600 transition-all">
                        RESTART
                    </button>
                    <button id="quitBtn" class="w-full py-3 rounded-xl font-orbitron font-bold text-pink-400 bg-pink-950/40 hover:bg-pink-900/50 border border-pink-500/40 transition-all">

    <script>
        /**
         * CYBER PULSE 3D - HTML5 & Vanilla JS Engine
         */

        // Canvas Setup & High-DPI Scaling
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');

        let width = 0;
        let height = 0;

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);

        // Web Audio API Synthesizer Engine
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.isPlaying = false;
                this.musicInterval = null;
                this.step = 0;
                this.bpm = 120;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playHitSound(lane, judgment) {
                if (!this.ctx || this.isMuted) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                // Distinct frequencies per lane
                const baseFreqs = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
                let freq = baseFreqs[lane] || 440;

                if (judgment === 'PERFECT') freq *= 1.25;
                if (judgment === 'MISS') freq = 110;

                osc.type = judgment === 'MISS' ? 'sawtooth' : 'triangle';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                if (judgment === 'MISS') {
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                } else {
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
                }

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            startMusic(bpm, songPattern) {
                this.init();
                this.stopMusic();
                this.bpm = bpm;
                this.step = 0;
                this.isPlaying = true;

                const stepDuration = (60 / this.bpm) / 4 * 1000; // 16th notes

                this.musicInterval = setInterval(() => {
                    if (!this.isPlaying) return;
                    this.triggerSynthStep(this.step, songPattern);
                    this.step = (this.step + 1) % 64;
                }, stepDuration);
            }

            triggerSynthStep(step, pattern) {
                if (!this.ctx || this.isMuted) return;

                const now = this.ctx.currentTime;

                // Kick drum on beats 0, 4, 8, 12...
                if (step % 4 === 0) {
                    const kick = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    kick.frequency.setValueAtTime(130, now);
                    kick.frequency.exponentialRampToValueAtTime(30, now + 0.08);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    kick.connect(gain);
                    gain.connect(this.ctx.destination);
                    kick.start(now);
                    kick.stop(now + 0.08);
                }

                // Synth Bass synthwave sequence
                if (step % 2 === 0) {
                    const bassNotes = [65.41, 65.41, 73.42, 87.31, 58.27, 58.27, 65.41, 98.00];
                    const note = bassNotes[Math.floor(step / 4) % bassNotes.length];
                    
                    const bass = this.ctx.createOscillator();
                    const filter = this.ctx.createBiquadFilter();
                    const gain = this.ctx.createGain();

                    bass.type = 'sawtooth';
                    bass.frequency.setValueAtTime(note, now);

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(400, now);
                    filter.frequency.exponentialRampToValueAtTime(100, now + 0.12);

                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                    bass.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    bass.start(now);
                    bass.stop(now + 0.12);
                }
            }

            stopMusic() {
                this.isPlaying = false;
                if (this.musicInterval) {
                    clearInterval(this.musicInterval);
                    this.musicInterval = null;
                }
            }
        }

        const audio = new AudioEngine();

        // 3D Perspective Highway Projection Geometry Constants
        const CAMERA = {
            horizonY: 0.22,     // Horizon line relative Y (22% from canvas top)
            vanishingW: 0.06,   // Width of track horizon relative to canvas width
            bottomW: 0.85,      // Bottom highway width relative to canvas width
            bottomY: 0.88,      // Judgment Line Y position (88% down canvas)
            depthZ: 1000        // Maximum 3D Depth
        };

        const LANE_COLORS = [
            { main: '#06b6d4', glow: 'rgba(6, 182, 212, 0.6)', name: 'D' }, // Cyan
            { main: '#a855f7', glow: 'rgba(168, 85, 247, 0.6)', name: 'F' }, // Purple
            { main: '#ec4899', glow: 'rgba(236, 72, 153, 0.6)', name: 'J' }, // Pink
            { main: '#f59e0b', glow: 'rgba(245, 158, 11, 0.6)', name: 'K' }  // Amber
        ];

        // Song Definitions & Chart Generators
        const SONGS = [
            {
                name: "CYBER BREEZE",
                bpm: 120,
                difficulty: "EASY",
                color: "#06b6d4",
                speed: 380, // Z units per second
                generateChart: function() {
                    const notes = [];
                    const duration = 40; // seconds
                    for (let t = 2.0; t < duration; t += 0.8) {
                        const lane = Math.floor((Math.sin(t * 3) * 0.5 + 0.5) * 4) % 4;
                        notes.push({ time: t, lane: lane, hit: false, missed: false });
                    }
                    return notes;
                }
            },
            {
                name: "NEON RUSH",
                bpm: 140,
                difficulty: "MEDIUM",
                color: "#a855f7",
                speed: 480,
                generateChart: function() {
                    const notes = [];
                    const duration = 50;
                    for (let t = 2.0; t < duration; t += 0.5) {
                        const lane = Math.floor(Math.random() * 4);
                        notes.push({ time: t, lane: lane, hit: false, missed: false });
                        // Occasional double notes
                        if (t > 10 && Math.random() < 0.25) {
                            const secondLane = (lane + 2) % 4;
                            notes.push({ time: t, lane: secondLane, hit: false, missed: false });
                        }
                    }
                    return notes;
                }
            },
            {
                name: "HYPERDRIVE",
                bpm: 165,
                difficulty: "HARD",
                color: "#ec4899",
                speed: 580,
                generateChart: function() {
                    const notes = [];
                    const duration = 60;
                    for (let t = 1.5; t < duration; t += 0.35) {
                        const lane = Math.floor(Math.random() * 4);
                        notes.push({ time: t, lane: lane, hit: false, missed: false });
                        if (Math.random() < 0.35) {
                            const secondLane = (lane + 1 + Math.floor(Math.random() * 3)) % 4;
                            notes.push({ time: t, lane: secondLane, hit: false, missed: false });
                        }
                    }
                    return notes;
                }
            }
        ];

        // Core Game State
        let selectedSongIndex = 1;
        let gameState = 'MENU'; // 'MENU', 'PLAYING', 'PAUSED', 'GAMEOVER'
        let currentChart = [];
        let activeSong = null;
        let gameTime = 0;
        let lastTimestamp = 0;

        // Scoring & Statistics
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let health = 100;
        let totalNotes = 0;
        let hits = { PERFECT: 0, GREAT: 0, GOOD: 0, MISS: 0 };

        // Visual Effects Arrays
        let particles = [];
        let judgmentTexts = [];
        let keyState = [false, false, false, false];
        let laneFlashes = [0, 0, 0, 0]; // Flash intensity (0 to 1)
        let screenShakeAmount = 0;

        // 3D Perspective Mapping Utilities
        function project3D(laneIndex, zNorm) {
            // zNorm ranges from 0 (at judgment bar) to 1 (at vanishing horizon)
            const horizonY = height * CAMERA.horizonY;
            const bottomY = height * CAMERA.bottomY;

            // Current Y position based on depth
            const y = horizonY + (bottomY - horizonY) * (1 - zNorm);

            // Interpolate total width at depth Z
            const topWidth = width * CAMERA.vanishingW;
            const bottomWidth = width * CAMERA.bottomW;
            const currentTrackWidth = topWidth + (bottomWidth - topWidth) * (1 - zNorm);

            // X offset relative to screen center
            const centerX = width / 2;
            const laneWidth = currentTrackWidth / 4;
            const laneLeft = centerX - (currentTrackWidth / 2) + (laneIndex * laneWidth);
            const x = laneLeft + (laneWidth / 2);

            return { x, y, laneWidth, scale: (1 - zNorm) };
        }

        // Particle Class for Explosions
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.8) * 10;
                this.size = Math.random() * 5 + 3;
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3; // Gravity
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Judgment Floating Text
        class JudgmentText {
            constructor(text, color) {
                this.text = text;
                this.color = color;
                this.y = height * CAMERA.bottomY - 60;
                this.alpha = 1;
                this.scale = 1.4;
            }

            update() {
                this.y -= 1.2;
                this.alpha -= 0.025;
                this.scale = Math.max(1, this.scale - 0.03);
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.font = `900 ${Math.floor(28 * this.scale)}px Orbitron, sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(this.text, width / 2, this.y);
                ctx.restore();
            }
        }

        // Spawn Visual FX
        function triggerHitFX(lane, judgmentText, color) {
            const p = project3D(lane, 0);
            
            // Spawn particles
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(p.x, p.y, color));
            }

            // Spawn Rating Text
            judgmentTexts.push(new JudgmentText(judgmentText, color));

            // Flash Lane
            laneFlashes[lane] = 1.0;

            // Screen Shake
            screenShakeAmount = judgmentText === 'PERFECT' ? 8 : 4;
        }

        // Handle Note Hit Processing
        function checkNoteHit(lane) {
            if (gameState !== 'PLAYING') return;

            const speed = activeSong.speed;
            const hitWindowTime = 0.22; // Seconds tolerance window

            let closestNote = null;
            let minDiff = Infinity;

            for (let note of currentChart) {
                if (note.lane === lane && !note.hit && !note.missed) {
                    const diff = Math.abs(note.time - gameTime);
                    if (diff < hitWindowTime && diff < minDiff) {
                        minDiff = diff;
                        closestNote = note;
                    }
                }
            }

            if (closestNote) {
                closestNote.hit = true;

                let rating = 'GOOD';
                let pts = 300;
                let color = '#38bdf8';

                if (minDiff < 0.06) {
                    rating = 'PERFECT';
                    pts = 1000;
                    color = '#22d3ee';
                } else if (minDiff < 0.12) {
                    rating = 'GREAT';
                    pts = 600;
                    color = '#c084fc';
                }

                combo++;
                if (combo > maxCombo) maxCombo = combo;

                score += pts + (combo * 15);
                health = Math.min(100, health + 3);
                hits[rating]++;

                audio.playHitSound(lane, rating);
                triggerHitFX(lane, rating, color);
            } else {
                // Empty key tap / Misclick
                laneFlashes[lane] = 0.4;
            }

            updateHUD();
        }

        // Process Missed Notes
        function updateNoteStatus() {
            for (let note of currentChart) {
                if (!note.hit && !note.missed && gameTime > note.time + 0.22) {
                    note.missed = true;
                    combo = 0;
                    health = Math.max(0, health - 12);
                    hits.MISS++;

                    audio.playHitSound(note.lane, 'MISS');
                    judgmentTexts.push(new JudgmentText('MISS', '#ef4444'));

                    if (health <= 0) {
                        triggerGameOver(false);
                        return;
                    }
                }
            }
        }

        // Calculate Accuracy Percentage
        function getAccuracy() {
            const total = hits.PERFECT + hits.GREAT + hits.GOOD + hits.MISS;
            if (total === 0) return 100;
            const weightedHits = (hits.PERFECT * 1.0) + (hits.GREAT * 0.7) + (hits.GOOD * 0.4);
            return ((weightedHits / total) * 100).toFixed(1);
        }

        // Update HUD DOM Elements
        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = String(score).padStart(7, '0');
            document.getElementById('accuracyDisplay').innerText = `${getAccuracy()}%`;
            document.getElementById('healthBar').style.width = `${health}%`;
        }

        // Draw Synthwave 3D Highway & Canvas Elements
        function drawScene() {
            ctx.save();

            // Apply Screen Shake
            if (screenShakeAmount > 0) {
                const sx = (Math.random() - 0.5) * screenShakeAmount;
                const sy = (Math.random() - 0.5) * screenShakeAmount;
                ctx.translate(sx, sy);
                screenShakeAmount *= 0.88;
                if (screenShakeAmount < 0.2) screenShakeAmount = 0;
            }

            // 1. Background Gradient
            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#030014');
            bgGrad.addColorStop(0.5, '#0b0026');
            bgGrad.addColorStop(1, '#050010');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            const horizonY = height * CAMERA.horizonY;
            const bottomY = height * CAMERA.bottomY;

            // 2. Animated Horizon Grid & Sun
            ctx.save();
            // Sun glow
            const sunGrad = ctx.createRadialGradient(width / 2, horizonY, 5, width / 2, horizonY, 120);
            sunGrad.addColorStop(0, 'rgba(236, 72, 153, 0.8)');
            sunGrad.addColorStop(0.5, 'rgba(168, 85, 247, 0.3)');
            sunGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(width / 2, horizonY, 120, 0, Math.PI * 2);
            ctx.fill();

            // Horizon Line
            ctx.strokeStyle = '#ec4899';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ec4899';
            ctx.beginPath();
            ctx.moveTo(0, horizonY);
            ctx.lineTo(width, horizonY);
            ctx.stroke();
            ctx.restore();

            // 3. 3D Track Highway Surface
            const pTopLeft = project3D(0, 1);
            const pTopRight = project3D(4, 1);
            const pBotLeft = project3D(0, 0);
            const pBotRight = project3D(4, 0);

            ctx.save();
            const trackGrad = ctx.createLinearGradient(0, horizonY, 0, bottomY);
            trackGrad.addColorStop(0, 'rgba(15, 12, 41, 0.9)');
            trackGrad.addColorStop(1, 'rgba(30, 15, 60, 0.95)');
            ctx.fillStyle = trackGrad;
            ctx.beginPath();
            ctx.moveTo(pTopLeft.x - pTopLeft.laneWidth / 2, pTopLeft.y);
            ctx.lineTo(pTopRight.x - pTopRight.laneWidth / 2, pTopRight.y);
            ctx.lineTo(pBotRight.x - pBotRight.laneWidth / 2, pBotRight.y);
            ctx.lineTo(pBotLeft.x - pBotLeft.laneWidth / 2, pBotLeft.y);
            ctx.closePath();
            ctx.fill();

            // Track Border Lines
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.8)';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#06b6d4';
            ctx.stroke();
            ctx.restore();

            // 4. Draw Lane Dividers & Flashes
            for (let i = 0; i < 4; i++) {
                const p1 = project3D(i, 1);
                const p2 = project3D(i, 0);

                // Lane Flash Overlay on Hit
                if (laneFlashes[i] > 0) {
                    const p1Next = project3D(i + 1, 1);
                    const p2Next = project3D(i + 1, 0);

                    ctx.save();
                    ctx.globalAlpha = laneFlashes[i] * 0.35;
                    ctx.fillStyle = LANE_COLORS[i].main;
                    ctx.beginPath();
                    ctx.moveTo(p1.x - p1.laneWidth / 2, p1.y);
                    ctx.lineTo(p1Next.x - p1Next.laneWidth / 2, p1Next.y);
                    ctx.lineTo(p2Next.x - p2Next.laneWidth / 2, p2Next.y);
                    ctx.lineTo(p2.x - p2.laneWidth / 2, p2.y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();

                    laneFlashes[i] -= 0.05;
                }

                // Inner Lane Dividers
                if (i > 0) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(p1.x - p1.laneWidth / 2, p1.y);
                    ctx.lineTo(p2.x - p2.laneWidth / 2, p2.y);
                    ctx.stroke();
                }
            }

            // Moving Horizontal Perspective Grid Lines
            const speed = activeSong ? activeSong.speed : 400;
            const gridOffset = (gameTime * speed * 0.001) % 1;
            for (let z = 0; z <= 1; z += 0.1) {
                const effectiveZ = (z - gridOffset + 1) % 1;
                const lineP1 = project3D(0, effectiveZ);
                const lineP2 = project3D(4, effectiveZ);

                ctx.strokeStyle = `rgba(168, 85, 247, ${0.1 + (1 - effectiveZ) * 0.25})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(lineP1.x - lineP1.laneWidth / 2, lineP1.y);
                ctx.lineTo(lineP2.x - lineP2.laneWidth / 2, lineP2.y);
                ctx.stroke();
            }

            // 5. Judgment Bar Line (Target Zone)
            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#06b6d4';
            ctx.beginPath();
            ctx.moveTo(pBotLeft.x - pBotLeft.laneWidth / 2, pBotLeft.y);
            ctx.lineTo(pBotRight.x - pBotRight.laneWidth / 2, pBotRight.y);
            ctx.stroke();

            // Target Lane Key Receptacles
            for (let i = 0; i < 4; i++) {
                const targetP = project3D(i, 0);
                const isPressed = keyState[i];

                ctx.save();
                ctx.fillStyle = isPressed ? LANE_COLORS[i].main : 'rgba(255, 255, 255, 0.1)';
                ctx.strokeStyle = LANE_COLORS[i].main;
                ctx.lineWidth = isPressed ? 3 : 1.5;
                ctx.shadowBlur = isPressed ? 20 : 5;
                ctx.shadowColor = LANE_COLORS[i].main;

                const padW = targetP.laneWidth * 0.8;
                const padH = 14;
                ctx.beginPath();
                ctx.roundRect(targetP.x - padW / 2, targetP.y - padH / 2, padW, padH, 4);
                ctx.fill();
                ctx.stroke();

                // Key Name Labels
                ctx.fillStyle = isPressed ? '#000' : '#fff';
                ctx.font = '700 12px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(LANE_COLORS[i].name, targetP.x, targetP.y);
                ctx.restore();
            }
            ctx.restore();

            // 6. Draw 3D Falling Notes
            if (gameState === 'PLAYING' || gameState === 'PAUSED') {
                const speed = activeSong.speed;

                for (let note of currentChart) {
                    if (note.hit || note.missed) continue;

                    const timeDiff = note.time - gameTime;
                    const zDistance = timeDiff * speed; // Z distance in 3D space
                    const zNorm = zDistance / CAMERA.depthZ;

                    // Only render notes within viewable depth range
                    if (zNorm >= 0 && zNorm <= 1.05) {
                        const noteP = project3D(note.lane, zNorm);
                        const colorInfo = LANE_COLORS[note.lane];

                        ctx.save();
                        const noteW = noteP.laneWidth * 0.85;
                        const noteH = 18 * Math.max(0.2, noteP.scale);

                        // Dynamic Note Glow & Body
                        ctx.fillStyle = colorInfo.main;
                        ctx.shadowBlur = 15 * noteP.scale;
                        ctx.shadowColor = colorInfo.main;

                        ctx.beginPath();
                        ctx.roundRect(noteP.x - noteW / 2, noteP.y - noteH / 2, noteW, noteH, 6 * noteP.scale);
                        ctx.fill();

                        // Inner Highlight
                        ctx.fillStyle = '#ffffff';
                        ctx.globalAlpha = 0.6;
                        ctx.beginPath();
                        ctx.roundRect(noteP.x - noteW * 0.35, noteP.y - noteH * 0.25, noteW * 0.7, noteH * 0.5, 3);
                        ctx.fill();

                        ctx.restore();
                    }
                }
            }

            // 7. Render Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // 8. Render Judgment Texts
            for (let i = judgmentTexts.length - 1; i >= 0; i--) {
                const jt = judgmentTexts[i];
                jt.update();
                jt.draw(ctx);
                if (jt.alpha <= 0) judgmentTexts.splice(i, 1);
            }

            // 9. Combo Display Overlay in Canvas
            if (combo > 2 && gameState === 'PLAYING') {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ec4899';
                ctx.font = '900 36px Orbitron, sans-serif';
                ctx.fillText(`${combo}`, width / 2, height * 0.45);
                ctx.font = '700 14px Orbitron, sans-serif';
                ctx.fillStyle = '#ec4899';
                ctx.fillText('COMBO', width / 2, height * 0.45 + 20);
                ctx.restore();
            }

            ctx.restore();
        }

        // Main Animation & Physics Loop
        function gameLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            if (gameState === 'PLAYING') {
                gameTime += delta;
                updateNoteStatus();

                // Check Stage Completion
                const lastNoteTime = currentChart.length > 0 ? currentChart[currentChart.length - 1].time : 0;
                if (gameTime > lastNoteTime + 2.0) {
                    triggerGameOver(true);
                }
            }

            drawScene();
            requestAnimationFrame(gameLoop);
        }

        // Start / Stop Game Flow
        function startGame(songIndex) {
            selectedSongIndex = songIndex;
            activeSong = SONGS[songIndex];
            currentChart = activeSong.generateChart();

            // Reset Game Stats
            score = 0;
            combo = 0;
            maxCombo = 0;
            health = 100;
            gameTime = 0;
            lastTimestamp = 0;
            hits = { PERFECT: 0, GREAT: 0, GOOD: 0, MISS: 0 };
            particles = [];
            judgmentTexts = [];

            gameState = 'PLAYING';

            // UI Elements
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('modalOverlay').classList.add('hidden');
            document.getElementById('pausePanel').classList.add('hidden');
            document.getElementById('resultsPanel').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            updateHUD();
            audio.startMusic(activeSong.bpm, activeSong.name);
        }

        function triggerGameOver(cleared) {
            gameState = 'GAMEOVER';
            audio.stopMusic();

            const accuracy = parseFloat(getAccuracy());
            let rank = 'F';
            let rankColor = 'border-red-500 text-red-500 shadow-red-500/50';

            if (cleared) {
                if (accuracy >= 95 && hits.MISS === 0) { rank = 'S'; rankColor = 'border-amber-400 text-amber-400 shadow-amber-500/50'; }
                else if (accuracy >= 88) { rank = 'A'; rankColor = 'border-purple-400 text-purple-400 shadow-purple-500/50'; }
                else if (accuracy >= 78) { rank = 'B'; rankColor = 'border-cyan-400 text-cyan-400 shadow-cyan-500/50'; }
                else if (accuracy >= 65) { rank = 'C'; rankColor = 'border-green-400 text-green-400 shadow-green-500/50'; }
            }

            // Populate Results UI
            document.getElementById('rankBadge').className = `w-24 h-24 rounded-2xl flex items-center justify-center font-orbitron text-6xl font-black mb-3 border-2 shadow-2xl ${rankColor}`;
            document.getElementById('rankBadge').innerText = rank;
            document.getElementById('resultTitle').innerText = cleared ? 'STAGE CLEAR!' : 'STAGE FAILED';
            document.getElementById('songResultName').innerText = activeSong.name;
            document.getElementById('resScore').innerText = String(score).padStart(7, '0');
            document.getElementById('resAccuracy').innerText = `${accuracy}%`;
            document.getElementById('resMaxCombo').innerText = maxCombo;
            document.getElementById('resHitsMisses').innerText = `${hits.PERFECT + hits.GREAT + hits.GOOD} / ${hits.MISS}`;

            document.getElementById('modalOverlay').classList.remove('hidden');
            document.getElementById('resultsPanel').classList.remove('hidden');
            document.getElementById('pausePanel').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                audio.stopMusic();
                document.getElementById('modalOverlay').classList.remove('hidden');
                document.getElementById('pausePanel').classList.remove('hidden');
                document.getElementById('resultsPanel').classList.add('hidden');
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                lastTimestamp = performance.now();
                audio.startMusic(activeSong.bpm, activeSong.name);
                document.getElementById('modalOverlay').classList.add('hidden');
                document.getElementById('pausePanel').classList.add('hidden');
            }
        }

        // Input Handlers (Keyboard & Touch)
        const KEY_MAP = {
            'd': 0, 'D': 0, 'ArrowLeft': 0,
            'f': 1, 'F': 1, 'ArrowDown': 1,
            'j': 2, 'J': 2, 'ArrowUp': 2,
            'k': 3, 'K': 3, 'ArrowRight': 3
        };

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;

            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                togglePause();
                return;
            }

            if (KEY_MAP.hasOwnProperty(e.key)) {
                const lane = KEY_MAP[e.key];
                keyState[lane] = true;
                checkNoteHit(lane);

                // Highlight touch button on desktop key press
                const touchBtn = document.querySelectorAll('#touchControls button')[lane];
                if (touchBtn) touchBtn.classList.add('pressed');
            }
        });

        window.addEventListener('keyup', (e) => {
            if (KEY_MAP.hasOwnProperty(e.key)) {
                const lane = KEY_MAP[e.key];
                keyState[lane] = false;

                const touchBtn = document.querySelectorAll('#touchControls button')[lane];
                if (touchBtn) touchBtn.classList.remove('pressed');
            }
        });

        // Touch Control Listeners
        document.querySelectorAll('#touchControls button').forEach((btn) => {
            const lane = parseInt(KEY_MAP[btn.dataset.key]);

            const triggerTouch = (e) => {
                e.preventDefault();
                keyState[lane] = true;
                checkNoteHit(lane);
                btn.classList.add('pressed');
            };

            const releaseTouch = (e) => {
                e.preventDefault();
                keyState[lane] = false;
                btn.classList.remove('pressed');
            };

            btn.addEventListener('touchstart', triggerTouch);
            btn.addEventListener('touchend', releaseTouch);
            btn.addEventListener('mousedown', triggerTouch);
            btn.addEventListener('mouseup', releaseTouch);
        });

        // DOM UI Event Listeners
        document.querySelectorAll('.song-select-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.song-select-btn').forEach(b => {
                    b.classList.remove('border-purple-500', 'bg-purple-500/20', 'active-song');
                });
                btn.classList.add('border-purple-500', 'bg-purple-500/20', 'active-song');
                selectedSongIndex = parseInt(btn.dataset.song);
            });
        });

        document.getElementById('startBtn').addEventListener('click', () => startGame(selectedSongIndex));
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('resumeBtn').addEventListener('click', togglePause);
        document.getElementById('retryBtn').addEventListener('click', () => startGame(selectedSongIndex));
        document.getElementById('restartPauseBtn').addEventListener('click', () => startGame(selectedSongIndex));

        document.getElementById('menuBtn').addEventListener('click', () => {
            gameState = 'MENU';
            document.getElementById('modalOverlay').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
            document.getElementById('hud').classList.add('hidden');
        });

        document.getElementById('quitBtn').addEventListener('click', () => {
            gameState = 'MENU';
            audio.stopMusic();
            document.getElementById('modalOverlay').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
            document.getElementById('hud').classList.add('hidden');
        });

        // Initialize Engine & Canvas Loop
        resizeCanvas();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
